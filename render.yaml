services:
  - type: web
    name: trendproof-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TRENDPROOF_ORIGINS
        value: "*"
      - key: NASA_API_KEY
        value: W9nnn7jzrhTBrBrBQGDWch6KMGQQPMLWFgcqHBnn
